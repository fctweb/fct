  <style>
    :root {
      color-scheme: light;
      --ground: #ebe8e1;
      --surface: #fffefb;
      --ink: #17242c;
      --muted: #59676f;
      --rule: #d5d2ca;
      --accent: #1f5874;
      --accent-dark: #153f55;
      --accent-soft: #e5eef2;
      --danger: #9f2f2f;
      --focus: #245a78;
      --radius: 6px;
      --space-1: 8px;
      --space-2: 12px;
      --space-3: 16px;
      --space-4: 24px;
      --space-5: 32px;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      overflow-x: hidden;
      background: var(--ground);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    button { font: inherit; }

    button:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    ::selection { background: #c9dbe5; color: var(--ink); }

    .app {
      width: min(100%, 1200px);
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: 0 clamp(24px, 5vw, 68px) max(20px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: var(--surface);
    }

    .topbar {
      min-height: 88px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      margin-inline: clamp(-68px, -5vw, -24px);
      padding: max(16px, env(safe-area-inset-top)) clamp(24px, 5vw, 68px) 16px;
      border-bottom: 0;
      background: var(--accent-dark);
    }

    .title {
      margin: 0;
      color: white;
      font-size: clamp(23px, 3vw, 31px);
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .secondary-button,
    .text-button,
    .close-button {
      min-height: 48px;
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
    }

    .topbar .secondary-button {
      border-color: rgba(255, 255, 255, 0.62);
      background: transparent;
      color: white;
    }
    .topbar .secondary-button:hover { background: rgba(255, 255, 255, 0.1); }
    .secondary-button { padding: 0 18px; font-weight: 500; white-space: nowrap; }
    .secondary-button:hover, .text-button:hover, .close-button:hover { background: #f1efea; }

    main {
      align-self: start;
      width: 100%;
      padding: clamp(32px, 5vh, 54px) 0 var(--space-5);
    }

    .instruction {
      position: relative;
      margin: 0 0 9px;
      padding-left: 18px;
      font-size: clamp(24px, 3.6vw, 38px);
      line-height: 1.25;
      font-weight: 650;
      letter-spacing: -0.025em;
    }

    .instruction::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      border-radius: 2px;
      background: var(--accent);
    }

    .helper {
      margin: 0 0 clamp(25px, 4vh, 38px) 18px;
      color: var(--muted);
      font-size: 17px;
    }

    .class-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
    }

    .class-button,
    .number-button,
    .primary-button {
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--accent-dark);
      cursor: pointer;
      font-weight: 600;
    }

    .class-button {
      min-height: 68px;
      padding: 10px;
      font-size: clamp(18px, 2.1vw, 22px);
      border-width: 0;
      background: var(--accent);
      color: white;
      letter-spacing: 0.04em;
    }

    .class-button[data-grade="初一"] { background: #9d3434; }
    .class-button[data-grade="初二"] { background: #a95016; }
    .class-button[data-grade="初三"] { background: #d5a91b; color: #24200f; }
    .class-button[data-grade="高一"] { background: #347153; }
    .class-button[data-grade="高二"] { background: #28648a; }
    .class-button[data-grade="高三"] { background: #684a80; }
    .class-button:hover { filter: brightness(0.9); }
    .class-button:active { filter: brightness(0.8); }
    .number-button:hover { background: var(--accent-soft); }
    .number-button:active { background: #d4e4eb; }

    .statusbar {
      min-height: 64px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-top: 1px solid var(--rule);
      color: var(--muted);
      font-size: 15px;
    }

    .status-label {
      padding: 5px 9px;
      border-radius: 4px;
      background: var(--accent-soft);
      color: var(--accent-dark);
      font-weight: 650;
    }
    .statusbar[data-state="offline"], .statusbar[data-state="error"] { color: var(--danger); }

    .dialog-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(28, 36, 43, 0.56);
    }

    .dialog-layer[hidden] { display: none; }

    .dialog {
      width: min(760px, 100%);
      max-height: calc(100vh - 48px);
      max-height: calc(100dvh - 48px);
      overflow: auto;
      border: 0;
      border-radius: 8px;
      background: var(--surface);
      padding: clamp(24px, 4vw, 38px);
      box-shadow: 0 8px 24px rgba(23, 36, 44, 0.16);
    }

    .dialog-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--rule);
    }

    .dialog-title { margin: 0; color: var(--accent-dark); font-size: clamp(25px, 4vw, 35px); line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; }
    .dialog-subtitle { margin: 6px 0 0; color: var(--muted); font-size: 17px; }

    .close-button { width: 48px; flex: 0 0 48px; font-size: 25px; line-height: 1; }

    .number-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 10px;
    }

    .number-button { min-height: 54px; font-size: 18px; font-variant-numeric: tabular-nums; }

    .receipt { text-align: left; }
    .receipt-message { margin: 0 0 24px; font-size: 19px; }
    .receipt-list { margin: 0; border-top: 1px solid var(--rule); }
    .receipt-row { display: grid; grid-template-columns: 90px 1fr; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--rule); }
    .receipt-row dt { color: var(--muted); }
    .receipt-row dd { margin: 0; color: var(--accent-dark); font-weight: 650; font-variant-numeric: tabular-nums; }

    .actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 28px; }
    .text-button, .primary-button { min-height: 50px; padding: 0 20px; }
    .primary-button { background: var(--accent); color: white; }
    .primary-button:hover { background: var(--accent-dark); }
    .primary-button:disabled { cursor: wait; opacity: 0.65; }

    .countdown { margin: 18px 0 0; color: var(--muted); }
    .error-text { color: var(--danger); }

    @media (max-width: 900px) {
      .app { padding-left: 28px; padding-right: 28px; }
      .topbar { margin-inline: -28px; padding-inline: 28px; }
      .class-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .number-grid { grid-template-columns: repeat(8, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
      .app { padding-left: 18px; padding-right: 18px; }
      .topbar { margin-inline: -18px; padding-inline: 18px; }
      .topbar { min-height: 76px; }
      .class-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .number-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
      .dialog-layer { padding: 12px; }
      .dialog { max-height: calc(100dvh - 24px); padding: 20px; }
    }

    @media (max-height: 820px) and (min-width: 700px) {
      main { padding-top: 26px; padding-bottom: 22px; }
      .helper { margin-bottom: 20px; }
      .class-button { min-height: 58px; }
      .dialog { padding: 24px; }
      .dialog-header { margin-bottom: 18px; padding-bottom: 14px; }
      .number-button { min-height: 50px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto; }
    }
  </style>
  <style>

    .grade-row[data-grade="初二"] { color:#d94318; }.grade-row[data-grade="初二"] .class-button { background:#fff0e8!important; }.grade-row[data-grade="初二"] .class-button:hover { background:#ffdfcf!important; }

    .grade-row[data-grade="高三"] { color:#4e25a8; }.grade-row[data-grade="高三"] .class-button { background:#eee9fa!important; }.grade-row[data-grade="高三"] .class-button:hover { background:#ded3f5!important; }

    .step.active { color:#0755ef; }.step.active .step-dot { background:#2160f3;box-shadow:0 8px 18px rgba(32,42,58,.16); }
    .step-line { position:relative;width:78px;height:4px;margin-top:25px;overflow:hidden;background:#c6d4e9;border-radius:4px; }
    .step-line::after { content:"";position:absolute;inset:0;background:#2160f3;border-radius:inherit;transform:scaleX(0);transform-origin:left center;transition:transform 420ms cubic-bezier(.16,1,.3,1); }

<body>
  <div class="backend-toast" id="backendToast" role="status" aria-live="polite"></div>
  <div class="auth-layer" id="authLayer">
    <form class="auth-card" id="authForm">
      <svg class="auth-icon" viewBox="0 0 100 88" aria-hidden="true"><path fill="#3974ef" d="M5 10Q25 3 46 15v61Q26 65 5 74zM95 10Q75 3 54 15v61q20-11 41-2z"/><path d="M10 68q22-8 40 5 18-13 40-5" fill="none" stroke="#ddecff" stroke-width="4" stroke-linecap="round"/></svg>
      <h1 class="auth-title">設備授權</h1>
      <p class="auth-copy">此登記頁面只供學校指定設備使用。首次使用請輸入授權密碼。</p>
      <label class="sr-only" for="authPassword">授權密碼</label>
      <input class="auth-field" id="authPassword" type="password" autocomplete="current-password" placeholder="請輸入授權密碼" required>
      <button class="auth-submit" id="authSubmit" type="submit">授權此設備</button>
      <p class="auth-error" id="authError" role="alert" aria-live="polite"></p>
    </form>
  </div>
  <div class="app">
    <header class="topbar">
      <svg class="brand-icon" viewBox="0 0 100 88" aria-hidden="true"><path fill="#3974ef" d="M5 10Q25 3 46 15v61Q26 65 5 74zM95 10Q75 3 54 15v61q20-11 41-2z"/><path d="M10 68q22-8 40 5 18-13 40-5" fill="none" stroke="#ddecff" stroke-width="4" stroke-linecap="round"/></svg>
      <div class="brand-copy"><h1 class="title">圖書館入館登記</h1><p class="brand-subtitle">請選擇你所在的班級</p></div>
      <button class="secondary-button" id="fullscreenButton" type="button">進入全螢幕</button>
    </header>

    <main>
      <section class="selection-panel" aria-label="班級選擇"><div class="class-grid" id="classGrid"></div></section>
      <aside class="guide-panel">
        <div>
          <div class="steps"><div class="step active" id="classStep"><span class="step-dot">1</span>選擇班級</div><span class="step-line" id="stepProgress" role="progressbar" aria-label="登記進度" aria-valuemin="1" aria-valuemax="2" aria-valuenow="1"></span><div class="step" id="numberStep"><span class="step-dot">2</span>選擇學號</div></div>
          <section class="stats-panel" aria-label="今日進館統計">
            <div class="today-summary"><div><div class="today-label">本月進館人數</div><div><span class="today-count" id="todayCount">—</span><span class="today-unit">人</span></div></div><h2 class="ranking-title">本月班級前三名</h2></div>
            <ol class="ranking-list" id="rankingList"><li class="ranking-item"><span class="rank-number">1</span><span class="rank-class">讀取中</span><span class="rank-count">—</span></li><li class="ranking-item"><span class="rank-number">2</span><span class="rank-class">—</span><span class="rank-count">—</span></li><li class="ranking-item"><span class="rank-number">3</span><span class="rank-class">—</span><span class="rank-count">—</span></li></ol>
            <section class="student-ranking"><h2 class="ranking-title">本月個人前三名</h2><ol class="ranking-list" id="studentRankingList"><li class="ranking-item"><span class="rank-number">1</span><span class="rank-class">讀取中</span><span class="rank-count">—</span></li><li class="ranking-item"><span class="rank-number">2</span><span class="rank-class">—</span><span class="rank-count">—</span></li><li class="ranking-item"><span class="rank-number">3</span><span class="rank-class">—</span><span class="rank-count">—</span></li></ol></section>
            <p class="stats-note" id="statsNote">正在同步 Google 表格…</p>
          </section>
        </div>
      </aside>
    </main>

    <footer class="statusbar" id="systemStatus" data-state="online" role="status" aria-live="polite">
      <span class="status-label">系統狀態</span>
      <span id="networkText">感謝你的配合 · 請自覺遵守圖書館規則</span>
    </footer>
  </div>

  <div class="zoom-controls" id="zoomControls" aria-label="畫面縮放">
    <button id="zoomOut" type="button" aria-label="縮小畫面">−</button><button class="zoom-hold" id="zoomHold" type="button" aria-label="目前縮放比例，長按三秒隱藏縮放控制"><svg class="hold-ring" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18"/></svg><span class="zoom-value" id="zoomValue">100%</span></button><button id="zoomIn" type="button" aria-label="放大畫面">＋</button>
  </div>
  <div class="zoom-restore-zone" id="zoomRestoreZone" aria-label="長按三秒顯示縮放控制"><svg class="hold-ring" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18"/></svg></div>

  <div class="dialog-layer" id="dialogLayer" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" aria-describedby="dialogSubtitle">
      <div class="dialog-header">
        <div>
          <h2 class="dialog-title" id="dialogTitle">選擇學號</h2>
          <p class="dialog-subtitle" id="dialogSubtitle"></p>
        </div>
        <button class="close-button" id="closeDialog" type="button" aria-label="關閉學號選擇">×</button>
      </div>
      <div id="dialogContent"></div>
    </section>
  </div>

  <script>
    (() => {
      "use strict";

      const API_URL = "https://script.google.com/macros/s/AKfycbzA4Aj81KG1gjEstNhAHchiC6BJVIVaA-53ZIibFvr1Cjv58giD9Mt8wEPyHJaqhSM/exec";
      const requestedView = (new URLSearchParams(location.search).get("view") || "").toLowerCase();
      const VIEW_MODE = ["stat", "stats", "statt", "statistics", "right"].includes(requestedView)
        ? "stats"
        : ["input", "entry", "left"].includes(requestedView)
          ? "input"
          : "combined";
      const SECURITY_VERSION = "apps-script-device-auth-v3";
      const SECURITY_VERSION_KEY = "library-security-version";
      const DEVICE_TOKEN_KEY = "library-secure-device-token-v1";
      const PORTRAIT_LAYOUT_WIDTH = 1280;
      const CLASSES = [
        "初一甲", "初一乙", "初一丙", "初一丁",
        "初二甲", "初二乙", "初二丙", "初二丁",
        "初三甲", "初三乙", "初三丙", "初三丁",
        "高一甲", "高一乙", "高一丙",
        "高二甲", "高二乙", "高二丙",
        "高三甲", "高三乙"
      ];
      const CLASS_THEMES = {
        "初一甲": ["#a91f50","#fdeaf1","#efbfd0"], "初一乙": ["#bd304e","#fcebee","#efc1ca"],
        "初一丙": ["#c94728","#fff0ea","#f1c5b8"], "初一丁": ["#a95816","#fff1e6","#ebc9ad"],
        "初二甲": ["#9a6500","#fff4d8","#ead39b"], "初二乙": ["#777000","#f8f5d9","#d9d39c"],
        "初二丙": ["#4c751e","#eff6df","#c9dba7"], "初二丁": ["#187044","#e7f5eb","#b7dac7"],
        "初三甲": ["#087168","#e5f6f3","#b4dcd6"], "初三乙": ["#006b83","#e4f3f7","#afd4de"],
        "初三丙": ["#185ba5","#e9f1fb","#b9cfeb"], "初三丁": ["#3e51ab","#eceffc","#c1c8eb"],
        "高一甲": ["#6040a9","#f0ecfb","#ccc1e9"], "高一乙": ["#773991","#f5ebf8","#d9bfe1"],
        "高一丙": ["#963170","#faeaf3","#e6bdd3"], "高二甲": ["#a33a58","#fbecef","#e7c2cc"],
        "高二乙": ["#8d4b22","#f9efe8","#dfc8b8"], "高二丙": ["#696132","#f4f2e7","#d7d2b8"],
        "高三甲": ["#356b50","#eaf4ee","#bdd6c7"], "高三乙": ["#3b6288","#eaf0f6","#bdcedd"]
      };

      const classGrid = document.getElementById("classGrid");
      const dialogLayer = document.getElementById("dialogLayer");
      const dialogTitle = document.getElementById("dialogTitle");
      const dialogSubtitle = document.getElementById("dialogSubtitle");
      const dialogContent = document.getElementById("dialogContent");
      const closeDialogButton = document.getElementById("closeDialog");
      const fullscreenButton = document.getElementById("fullscreenButton");
      const systemStatus = document.getElementById("systemStatus");
      const networkText = document.getElementById("networkText");
      const classStep = document.getElementById("classStep");
      const numberStep = document.getElementById("numberStep");
      const stepProgress = document.getElementById("stepProgress");
      const zoomValue = document.getElementById("zoomValue");
      const zoomControls = document.getElementById("zoomControls");
      const zoomHold = document.getElementById("zoomHold");
      const zoomRestoreZone = document.getElementById("zoomRestoreZone");
      const todayCount = document.getElementById("todayCount");
      const rankingList = document.getElementById("rankingList");
      const studentRankingList = document.getElementById("studentRankingList");
      const statsNote = document.getElementById("statsNote");
      const authLayer = document.getElementById("authLayer");
      const authForm = document.getElementById("authForm");
      const authPassword = document.getElementById("authPassword");
      const authSubmit = document.getElementById("authSubmit");
      const authError = document.getElementById("authError");
      const backendToast = document.getElementById("backendToast");
      const appElement = document.querySelector(".app");
      const brandSubtitle = document.querySelector(".brand-subtitle");

      if (VIEW_MODE === "input" || VIEW_MODE === "stats") appElement.classList.add(`view-${VIEW_MODE}`);
      if (VIEW_MODE === "input") brandSubtitle.textContent = "請選擇班級與學號";
      if (VIEW_MODE === "stats") brandSubtitle.textContent = "本月進館統計";

      let selectedClass = "";
      let selectedNumber = null;
      let previousFocus = null;
      let confirmationTimer = null;
      let confirmationSeconds = 3;
      let isSubmitting = false;
      let resetTimer = null;
      let interfaceZoom = Number(localStorage.getItem("library-interface-zoom") || 100);
      let statsRequestInFlight = false;
      let latestStatsSummary = null;
      let optimisticStatsUntil = 0;
      let zoomHoldTimer = null;
      let appStarted = false;
      let backendToastTimer = null;

      function createClassView() {
        const view = document.createElement("div");
        view.className = "transition-old-layer";
        ["初一","初二","初三","高一","高二","高三"].forEach((grade) => {
          const row = document.createElement("div");
          row.className = "grade-row";
          row.dataset.grade = grade;
          CLASSES.filter((name) => name.startsWith(grade)).forEach((className) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "class-button";
            button.textContent = className;
            button.addEventListener("click", () => openNumberDialog(className, button));
            row.appendChild(button);
          });
          view.appendChild(row);
        });
        return view;
      }

      function renderClasses() {
        classStep.classList.add("active");
        numberStep.classList.remove("active");
        stepProgress.classList.remove("is-complete");
        stepProgress.setAttribute("aria-valuenow", "1");
        classGrid.replaceChildren(createClassView());
      }

      async function slideContentTogether(nextView, direction = "forward") {
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (reducedMotion) {
          classGrid.replaceChildren(nextView);
          return;
        }
        const currentHeight = classGrid.getBoundingClientRect().height;
        const oldLayer = document.createElement("div");
        const nextLayer = document.createElement("div");
        oldLayer.className = "transition-old-layer";
        oldLayer.style.cssText = "position:absolute;inset:0;width:100%;";
        const enteringFrom = direction === "back" ? "calc(-100% - 42px)" : "calc(100% + 42px)";
        const exitingTo = direction === "back" ? "calc(100% + 42px)" : "calc(-100% - 42px)";
        nextLayer.style.cssText = `position:absolute;inset:0;width:100%;transform:translateX(${enteringFrom});`;
        oldLayer.append(...Array.from(classGrid.childNodes));
        nextLayer.appendChild(nextView);
        classGrid.replaceChildren(oldLayer, nextLayer);
        classGrid.style.position = "relative";
        classGrid.style.height = `${Math.max(currentHeight, nextLayer.scrollHeight)}px`;
        classGrid.style.pointerEvents = "none";
        const exit = oldLayer.animate(
          [{ transform:"translateX(0)" }, { transform:`translateX(${exitingTo})` }],
          { duration:360, easing:"cubic-bezier(.7,0,.3,1)", fill:"forwards" }
        );
        const enter = nextLayer.animate(
          [{ transform:`translateX(${enteringFrom})` }, { transform:"translateX(0)" }],
          { duration:360, easing:"cubic-bezier(.7,0,.3,1)", fill:"forwards" }
        );
        await Promise.all([exit.finished, enter.finished]).catch(() => {});
        classGrid.replaceChildren(nextView);
        classGrid.style.position = "";
        classGrid.style.height = "";
        classGrid.style.pointerEvents = "";
      }

      async function openNumberDialog(className, trigger) {
        clearTimers();
        selectedClass = className;
        selectedNumber = null;
        previousFocus = trigger;
        classStep.classList.remove("active");
        numberStep.classList.add("active");
        stepProgress.classList.add("is-complete");
        stepProgress.setAttribute("aria-valuenow", "2");

        const grid = document.createElement("div");
        grid.className = "number-grid";
        grid.setAttribute("aria-label", `${className}學號選擇`);
        for (let number = 1; number <= 40; number += 1) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "number-button";
          button.textContent = number;
          button.setAttribute("aria-label", `${number}號`);
          button.addEventListener("click", () => showConfirmation(number));
          grid.appendChild(button);
        }
        const view = document.createElement("div");
        view.className = "inline-number-view";
        const theme = CLASS_THEMES[className] || ["#2160f3","#edf3fc","#cad8ed"];
        view.style.setProperty("--class-color", theme[0]);
        view.style.setProperty("--class-soft", theme[1]);
        view.style.setProperty("--class-border", theme[2]);
        view.innerHTML = `<div class="inline-number-header"><h2 class="inline-number-title">選擇 <span>${escapeHtml(className)}</span> 學號</h2><button class="back-classes" type="button">返回班級</button></div>`;
        view.querySelector(".back-classes").addEventListener("click", returnToClassesAnimated);
        view.appendChild(grid);
        await slideContentTogether(view);
        requestAnimationFrame(() => grid.querySelector("button")?.focus());
      }

      async function returnToClassesAnimated() {
        clearTimers();
        classStep.classList.add("active");
        numberStep.classList.remove("active");
        stepProgress.classList.remove("is-complete");
        stepProgress.setAttribute("aria-valuenow", "1");
        selectedClass = "";
        selectedNumber = null;
        await slideContentTogether(createClassView(), "back");
        classGrid.querySelector("button")?.focus();
        updateNetworkStatus();
      }

      function showConfirmation(number) {
        clearTimers();
        selectedNumber = number;
        submitSelection();
      }

      function submitSelection() {
        if (isSubmitting || !selectedClass || selectedNumber === null) return;
        clearConfirmationTimer();
        isSubmitting = true;
        const record = { className: selectedClass, number: selectedNumber, createdAt: Date.now(), requestId: createRequestId() };
        showSuccess(record);
        if (VIEW_MODE !== "input") applyOptimisticStats(record);
        isSubmitting = false;
        postRecord(record)
          .then(() => {
            if (VIEW_MODE !== "input") {
              window.setTimeout(loadStats, 6500);
              window.setTimeout(loadStats, 10000);
            }
          })
          .catch((error) => {
            if (error.message === "device-not-authorized") {
              authLayer.hidden = false;
              authError.textContent = "此設備的授權已失效，請由老師重新授權";
              showBackendToast("设备授权已失效，请重新授权", true);
              authPassword.focus();
              return;
            }
            showBackendToast(navigator.onLine ? "后台提交失败，请老师检查记录" : "网络已断开，本次记录未送出", true);
          });
      }

      async function postRecord(record) {
        if (!navigator.onLine) throw new Error("offline");
        const result = await callApi({
          action: "submit",
          deviceToken: getOrCreateDeviceToken(),
          className: record.className,
          studentNumber: record.number,
          requestId: record.requestId || String(record.createdAt)
        });
        if (!result.ok) throw new Error(result.error || "submission-rejected");
        return result;
      }

      function showSuccess(record) {
        classGrid.innerHTML = `<div class="inline-state is-success" role="status" aria-live="polite"><div><div class="inline-state-icon"><svg class="success-mark" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="20"/><path d="M14 24.5l6.5 6.5L35 16.5"/></svg></div><h2>提交成功</h2><p>${escapeHtml(record.className)} · ${record.number} 號</p></div></div>`;
        setStatus("online", "登記已送出，系統在線");
        resetTimer = window.setTimeout(resetToClasses, 800);
      }

      function showBackendToast(message, isError) {
        if (backendToastTimer !== null) window.clearTimeout(backendToastTimer);
        backendToast.textContent = message;
        backendToast.classList.toggle("is-error", isError);
        backendToast.classList.add("is-visible");
        backendToastTimer = window.setTimeout(() => {
          backendToast.classList.remove("is-visible");
          backendToastTimer = null;
        }, isError ? 6000 : 2600);
      }

      function showError(message = "登記未送出，已保留目前選擇。") {
        classGrid.innerHTML = `<div class="inline-state"><div><div class="inline-state-icon" style="background:#b43a3a">!</div><h2>提交失敗</h2><p class="error-text">${escapeHtml(message)}</p><div class="actions"><button class="text-button" id="editSelection" type="button">返回學號</button><button class="primary-button" id="retrySubmit" type="button">重試提交</button></div></div></div>`;
        document.getElementById("editSelection")?.addEventListener("click", () => openNumberDialog(selectedClass, previousFocus));
        document.getElementById("retrySubmit")?.addEventListener("click", submitSelection);
        setStatus("error", "提交失敗，請重試或聯絡老師");
        document.getElementById("retrySubmit")?.focus();
      }

      function receiptMarkup(record, time, note, isError) {
        return `<div class="receipt">
          <p class="receipt-message${isError ? " error-text" : ""}">${note}</p>
          <dl class="receipt-list">
            <div class="receipt-row"><dt>班級</dt><dd>${escapeHtml(record.className)}</dd></div>
            <div class="receipt-row"><dt>學號</dt><dd>${record.number} 號</dd></div>
            <div class="receipt-row"><dt>時間</dt><dd>${time}</dd></div>
          </dl>
        </div>`;
      }

      function updateNetworkStatus() {
        if (navigator.onLine) {
          setStatus("online", "感謝你的配合 · 請自覺遵守圖書館規則");
        } else {
          setStatus("offline", "目前沒有網路，暫時無法登記");
        }
      }

      function setStatus(state, message) {
        systemStatus.dataset.state = state;
        networkText.textContent = message;
      }

      function closeDialog() {
        if (isSubmitting) return;
        clearTimers();
        dialogLayer.hidden = true;
        document.body.style.overflow = "";
        previousFocus?.focus();
      }

      function resetToClasses() {
        clearTimers();
        dialogLayer.hidden = true;
        document.body.style.overflow = "";
        selectedClass = "";
        selectedNumber = null;
        renderClasses();
        classGrid.querySelector("button")?.focus();
        updateNetworkStatus();
      }

      function applyInterfaceZoom() {
        interfaceZoom = Math.min(130, Math.max(70, interfaceZoom));
        const portraitFit = window.matchMedia("(orientation: portrait)").matches
          ? window.innerWidth / PORTRAIT_LAYOUT_WIDTH
          : 1;
        document.querySelector(".app").style.zoom = String(portraitFit * interfaceZoom / 100);
        zoomValue.textContent = `${interfaceZoom}%`;
        localStorage.setItem("library-interface-zoom", String(interfaceZoom));
      }

      function setZoomControlsHidden(hidden) {
        zoomControls.classList.toggle("is-hidden", hidden);
        zoomRestoreZone.classList.toggle("is-active", hidden);
        localStorage.setItem("library-zoom-controls-hidden", hidden ? "1" : "0");
      }

      function cancelZoomHold(target) {
        if (zoomHoldTimer !== null) window.clearTimeout(zoomHoldTimer);
        zoomHoldTimer = null;
        target.classList.remove("is-holding");
      }

      function bindLongPress(target, action) {
        target.addEventListener("pointerdown", (event) => {
          if (event.pointerType === "mouse" && event.button !== 0) return;
          cancelZoomHold(target);
          target.classList.add("is-holding");
          target.setPointerCapture?.(event.pointerId);
          zoomHoldTimer = window.setTimeout(() => {
            zoomHoldTimer = null;
            target.classList.remove("is-holding");
            action();
          }, 3000);
        });
        ["pointerup", "pointercancel", "lostpointercapture"].forEach((eventName) => target.addEventListener(eventName, () => cancelZoomHold(target)));
        target.addEventListener("contextmenu", (event) => event.preventDefault());
      }

      function renderStats(summary) {
        latestStatsSummary = summary;
        function fillRanking(list, ranking, unit) {
          list.replaceChildren(...[0, 1, 2].map((index) => {
          const item = document.createElement("li");
          item.className = "ranking-item";
          const result = ranking[index];
          item.innerHTML = `<span class="rank-number">${index + 1}</span><span class="rank-class"></span><span class="rank-count"></span>`;
          item.querySelector(".rank-class").textContent = result ? result.label : "—";
          item.querySelector(".rank-count").textContent = result ? `${result.count} ${unit}` : "—";
          return item;
          }));
        }
        todayCount.textContent = String(summary.total || 0);
        fillRanking(rankingList, Array.isArray(summary.classRanking) ? summary.classRanking : [], "人");
        fillRanking(studentRankingList, Array.isArray(summary.studentRanking) ? summary.studentRanking : [], "次");
        statsNote.textContent = `已同步 · ${new Intl.DateTimeFormat("zh-Hant", { hour:"2-digit", minute:"2-digit", hour12:false }).format(new Date())}`;
      }

      function applyOptimisticStats(record) {
        const summary = latestStatsSummary
          ? JSON.parse(JSON.stringify(latestStatsSummary))
          : { total:Number(todayCount.textContent) || 0,classCounts:{},studentCounts:{} };
        summary.classCounts = summary.classCounts || {};
        summary.studentCounts = summary.studentCounts || {};
        summary.total = Number(summary.total || 0) + 1;
        summary.classCounts[record.className] = Number(summary.classCounts[record.className] || 0) + 1;
        const studentKey = `${record.className}\u0000${record.number}`;
        summary.studentCounts[studentKey] = Number(summary.studentCounts[studentKey] || 0) + 1;
        const rank = (counts, formatLabel) => Object.entries(counts)
          .sort((left, right) => right[1] - left[1] || left[0].localeCompare(right[0], "zh-Hant"))
          .slice(0, 3)
          .map(([key, count]) => ({ label:formatLabel(key),count }));
        summary.classRanking = rank(summary.classCounts, key => key);
        summary.studentRanking = rank(summary.studentCounts, key => {
          const [className, studentNumber] = key.split("\u0000");
          return `${className} · ${studentNumber} 號`;
        });
        optimisticStatsUntil = Date.now() + 6000;
        renderStats(summary);
        statsNote.textContent = "本機已更新 · 等待服務端校準";
      }

      async function loadStats() {
        if (document.hidden || statsRequestInFlight || Date.now() < optimisticStatsUntil) return;
        statsRequestInFlight = true;
        try {
          const result = await callApi({ action:"stats",deviceToken:getOrCreateDeviceToken() });
          if (!result.ok) throw new Error(result.error || "stats-unavailable");
          renderStats(result);
        } catch (error) {
          statsNote.textContent = "統計暫時無法更新，稍後自動重試";
        } finally {
          statsRequestInFlight = false;
        }
      }

      function clearConfirmationTimer() {
        if (confirmationTimer !== null) window.clearInterval(confirmationTimer);
        confirmationTimer = null;
      }

      function clearTimers() {
        clearConfirmationTimer();
        if (resetTimer !== null) window.clearTimeout(resetTimer);
        resetTimer = null;
      }

      function formatTime(date) {
        return new Intl.DateTimeFormat("zh-Hant", {
          year: "numeric", month: "2-digit", day: "2-digit",
          hour: "2-digit", minute: "2-digit", second: "2-digit",
          hour12: false
        }).format(date);
      }

      function escapeHtml(value) {
        const span = document.createElement("span");
        span.textContent = value;
        return span.innerHTML;
      }

      function createRequestId() {
        if (typeof crypto.randomUUID === "function") return crypto.randomUUID();
        const bytes = crypto.getRandomValues(new Uint8Array(16));
        bytes[6] = (bytes[6] & 15) | 64;
        bytes[8] = (bytes[8] & 63) | 128;
        const hex = Array.from(bytes, byte => (byte < 16 ? "0" : "") + byte.toString(16));
        return `${hex.slice(0,4).join("")}-${hex.slice(4,6).join("")}-${hex.slice(6,8).join("")}-${hex.slice(8,10).join("")}-${hex.slice(10).join("")}`;
      }

      function getOrCreateDeviceToken() {
        let token = localStorage.getItem(DEVICE_TOKEN_KEY) || "";
        if (/^[A-Za-z0-9_-]{32,160}$/.test(token)) return token;
        const bytes = crypto.getRandomValues(new Uint8Array(32));
        token = btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
        localStorage.setItem(DEVICE_TOKEN_KEY, token);
        return token;
      }

      function migrateLegacyAuthorization() {
        if (localStorage.getItem(SECURITY_VERSION_KEY) === SECURITY_VERSION) return;
        localStorage.removeItem("library-device-authorized-v1");
        localStorage.removeItem("library-entry-submit-queue-v1");
        localStorage.removeItem(DEVICE_TOKEN_KEY);
        document.cookie = "library_device_authorized=; Max-Age=0; Path=/; SameSite=Lax";
        localStorage.setItem(SECURITY_VERSION_KEY, SECURITY_VERSION);
      }

      async function callApi(payload) {
        const controller = new AbortController();
        const timeoutId = window.setTimeout(() => controller.abort(), 15000);
        try {
          const response = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type":"text/plain;charset=UTF-8" },
            body: JSON.stringify(payload),
            redirect: "follow",
            cache: "no-store",
            signal: controller.signal
          });
          if (!response.ok) throw new Error("server-unavailable");
          return response.json();
        } finally {
          window.clearTimeout(timeoutId);
        }
      }

      async function checkDeviceAuthorization() {
        authLayer.hidden = false;
        authError.textContent = "正在自动检查；也可以直接输入密码授权";
        authSubmit.disabled = false;
        try {
          const result = await callApi({ action:"status",deviceToken:getOrCreateDeviceToken() });
          if (result.ok && result.authorized) {
            authError.textContent = "";
            startAuthorizedApp();
            return;
          }
          if (appStarted) return;
          authLayer.hidden = false;
          authError.textContent = "";
          authPassword.focus();
        } catch (error) {
          if (!appStarted) authError.textContent = "自动检查较慢，可以直接输入密码授权";
        }
      }

      function startAuthorizedApp() {
        authLayer.hidden = true;
        if (appStarted) return;
        appStarted = true;
        if (VIEW_MODE !== "stats") renderClasses();
        updateNetworkStatus();
        applyInterfaceZoom();
        setZoomControlsHidden(localStorage.getItem("library-zoom-controls-hidden") === "1");
        if (VIEW_MODE !== "input") {
          loadStats();
          window.setInterval(loadStats, 1000);
        }
      }

      async function submitAuthorization(event) {
        event.preventDefault();
        authError.textContent = "";
        authSubmit.disabled = true;
        authSubmit.textContent = "正在驗證…";
        try {
          const deviceToken = getOrCreateDeviceToken();
          const challenge = await callApi({ action:"challenge",deviceToken:deviceToken });
          if (!challenge.ok) throw new Error(challenge.error || "challenge-failed");
          const passwordVerifier = await sha256HexClient(`${challenge.salt}|${authPassword.value}`);
          const proof = await hmacSha256HexClient(`${challenge.nonce}|${deviceToken}`, passwordVerifier);
          authPassword.value = "";
          const result = await callApi({
            action: "enroll",
            proof: proof,
            deviceToken: deviceToken,
            deviceLabel: `${navigator.platform || "学校平板"} · ${new Date().toLocaleDateString("zh-Hant")}`
          });
          if (!result.ok) {
            authError.textContent = result.error === "invalid-proof"
              ? "授权密码不正确，请重新输入"
              : result.error === "too-many-attempts"
                ? "密码错误次数过多，请十分钟后重试"
                : "设备授权失败，请刷新后重试";
            authPassword.select();
            return;
          }
          startAuthorizedApp();
        } catch (error) {
          authError.textContent = "无法连接授权服务器，请检查网络后重试";
        } finally {
          authSubmit.disabled = false;
          authSubmit.textContent = "授權此設備";
        }
      }

      async function sha256HexClient(value) {
        const digest = new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(value)));
        return [...digest].map(byte => byte.toString(16).padStart(2, "0")).join("");
      }

      async function hmacSha256HexClient(value, keyHex) {
        const keyBytes = new TextEncoder().encode(keyHex);
        const key = await crypto.subtle.importKey("raw", keyBytes, { name:"HMAC",hash:"SHA-256" }, false, ["sign"]);
        const signature = new Uint8Array(await crypto.subtle.sign("HMAC", key, new TextEncoder().encode(value)));
        return [...signature].map(byte => byte.toString(16).padStart(2, "0")).join("");
      }

      async function toggleFullscreen() {
        try {
          if (!document.fullscreenElement) await document.documentElement.requestFullscreen?.();
          else await document.exitFullscreen?.();
        } catch (error) {
          setStatus("error", "無法進入全螢幕，仍可繼續登記");
        }
      }

      function updateFullscreenLabel() {
        fullscreenButton.textContent = document.fullscreenElement ? "退出全螢幕" : "進入全螢幕";
      }

      function trapDialogFocus(event) {
        if (event.key !== "Tab" || dialogLayer.hidden) return;
        const focusable = [...dialogLayer.querySelectorAll("button:not([hidden]):not([disabled])")];
        if (!focusable.length) return;
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      }

      closeDialogButton.addEventListener("click", closeDialog);
      dialogLayer.addEventListener("click", (event) => { if (event.target === dialogLayer) closeDialog(); });
      fullscreenButton.addEventListener("click", toggleFullscreen);
      document.addEventListener("fullscreenchange", updateFullscreenLabel);
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !dialogLayer.hidden) closeDialog();
        trapDialogFocus(event);
      });
      window.addEventListener("online", updateNetworkStatus);
      window.addEventListener("offline", updateNetworkStatus);
      window.addEventListener("resize", () => { if (appStarted) applyInterfaceZoom(); });
      document.addEventListener("visibilitychange", () => { if (!document.hidden) loadStats(); });
      document.getElementById("zoomOut").addEventListener("click", () => { interfaceZoom -= 10; applyInterfaceZoom(); });
      document.getElementById("zoomIn").addEventListener("click", () => { interfaceZoom += 10; applyInterfaceZoom(); });
      bindLongPress(zoomHold, () => setZoomControlsHidden(true));
      bindLongPress(zoomRestoreZone, () => setZoomControlsHidden(false));
      authForm.addEventListener("submit", submitAuthorization);

      migrateLegacyAuthorization();
      checkDeviceAuthorization();
    })();
  </script>
</body>
</html>
